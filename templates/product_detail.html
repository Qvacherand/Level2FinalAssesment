<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product['name'] }} - Tee Time</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="/">Tee Time</a>
            <a href="/products">Products</a>
            <a href="/about">About</a>
            <a href="/cart">Cart</a>
        </nav>
    </header>
<!--link products to database -->
    <main>
        <div class="product-detail">
            <img src="{{ url_for('static', filename='images/' + product['image']) }}" alt="{{ product['name'] }}">
            <h1>{{ product['name'] }}</h1>
            <p class="price">${{ product['price'] }}</p>
            <p class="keywords">{{ product['keywords'] }}</p>
            <p>Brand: {{ product['brand_name'] }}</p>
            <p>Category: {{ product['category_name'] }}</p>
            <button onclick="addToCart({{ product['product_id'] }})">Add to Cart</button>

<script>
    // Adds a product to the cart without refreshing the page
    function addToCart(productId) {
        fetch('/cart/add/' + productId, {
            method: 'POST'
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Added to cart!')
            }
        })
    }
</script>
            <a href="/products" class="btn">Back to Products</a>
        </div>
    </main>

    <footer>
        <p>Tee Time Golf Shop</p>
    </footer>
</body>
</html>
