<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product['name'] }} - Tee Time</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="/">Tee Time</a>
            <a href="/products">Products</a>
            <a href="/about">About</a>
            <a href="/cart">Cart</a>
        </nav>
    </header>
<!--link products to database -->
    <main>
        <div class="product-card">
            <img src="{{ url_for('static', filename='images/' + product['image']) }}" alt="{{ product['name'] }}">
            <h1 class="h1_products">{{ product['name'] }}</h1>
            <p class="price">${{ product['price'] }}</p>
            <p>Brand: {{ product['brand_name'] }}</p>
            <p>Category: {{ product['category_name'] }}</p>
            <button onclick="addToCart({{ product['product_id'] }})">Add to Cart</button>

    <!-- Toast notification -->
    <div id="toast" style="display:none; position:fixed; bottom:20px; right:20px; background:#2d7a2d; color:white; padding:12px 24px; border-radius:8px; font-size:16px;">
        Added to cart!
    </div>
    
    <script>
        function addToCart(productId) {
            fetch('/cart/add/' + productId, { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    let toast = document.getElementById('toast')
                    toast.style.display = 'block'
                    setTimeout(() => { toast.style.display = 'none' }, 2000)
                }
            })
        }
    </script>
            <a href="/products" class="btn">Back to Products</a>
        </div>
    </main>

    <footer>
        <p>Tee Time Golf Shop</p>
    </footer>
</body>
</html>
