<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Tee Time</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="/">Tee Time</a>
            <a href="/products">Products</a>
            <a href="/about">About</a>
            <a href="/cart">Cart</a>
        </nav>
    </header>

    <main>
        <h1 class="h1_products">All Products</h1>

     <!-- search and filter bar -->
        <form method="GET" action="/products">
            <input type="text" name="search" placeholder="Search products..." value="{{ search }}">
            <select name="category">
                <option value="">All Categories</option>
                {% for category in categories %}
                <option value="{{ category['category_id'] }}" {% if category['category_id']|string == selected_category %}selected{% endif %}>
                    {{ category['name'] }}
                </option>
                {% endfor %}
            </select>
            <button type="submit">Search</button>
        </form>

    <!-- product display -->
        <section class="product-grid">
            {% for product in products %}
        <div class="product-card">
            <img src="{{ url_for('static', filename='images/' + product['image']) }}" alt="{{ product['name'] }}">
            <p>{{ product['name'] }}</p>
            <p>${{ product['price'] }}</p>
            <a href="/product/{{ product['product_id'] }}">View Product</a>
            <button onclick="addToCart({{ product['product_id'] }})">Add to Cart</button>
        </div>
            {% endfor %}
        </section>
    </main>

    <footer>
        <p>Tee Time Golf Shop</p>
    </footer>

   <!-- Toast notification -->
<div id="toast" style="display:none; position:fixed; bottom:20px; right:20px; background:#2d7a2d; color:white; padding:12px 24px; border-radius:8px; font-size:16px;">
    Added to cart!
</div>

<script>
    function addToCart(productId) {
        fetch('/cart/add/' + productId, { method: 'POST' })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                let toast = document.getElementById('toast')
                toast.style.display = 'block'
                setTimeout(() => { toast.style.display = 'none' }, 2000)
            }
        })
    }
</script>
</body>
</html>
